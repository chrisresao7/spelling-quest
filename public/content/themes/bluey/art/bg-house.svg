<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <!-- Original background drawn for Spelling Quest: a raised timber house and backyard, soft painted look. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86c9ee"/><stop offset="0.55" stop-color="#bfe3f3"/><stop offset="0.8" stop-color="#fbeec9"/></linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3d17f"/><stop offset="1" stop-color="#8cc46e"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe6d2"/><stop offset="1" stop-color="#b9d8c0"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9735a"/><stop offset="1" stop-color="#c25f4a"/></linearGradient>
    <pattern id="lattice" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="22" height="22" fill="#7d9c86"/><rect width="6" height="22" fill="#f4ecd8"/><rect width="22" height="6" fill="#f4ecd8"/></pattern>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="4" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="cloud"><feGaussianBlur stdDeviation="2.5"/></filter>
    <clipPath id="roofclip"><path d="M870 400 L1010 270 H1340 L1480 400 Z"/></clipPath>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="g2"><feFuncR type="linear" slope="0.2" intercept="0.86"/><feFuncG type="linear" slope="0.2" intercept="0.86"/><feFuncB type="linear" slope="0.2" intercept="0.86"/><feFuncA type="linear" slope="0" intercept="1"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="g2" mode="multiply"/>
    </filter>
  </defs>
  <g filter="url(#grain)">
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1450" cy="140" r="120" fill="#fff2b3" opacity="0.4"/>
  <circle cx="1450" cy="140" r="62" fill="#ffe27a"/>
